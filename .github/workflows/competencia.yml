name: competencia
on:
  push:
    paths: ['jobs/competencia.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "yt-dlp[default]"
      - run: python motor/competencia.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git pull -q; git add jobs/competencia.md && git commit -m "Competencia: Shorts de GTA 6 con más vistas" && git push
