name: prueba
on:
  push:
    paths: ['pruebas/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U "yt-dlp[default]" playwright; curl -fsSL https://deno.land/install.sh | sh -s -- -y > /dev/null 2>&1; echo "$HOME/.deno/bin" >> $GITHUB_PATH
          python -m playwright install --with-deps chromium > /dev/null
          ffmpeg -version | head -1; yt-dlp --version
      - name: Pruebas
        run: |
          mkdir -p out
          python pruebas/prueba.py 2>&1 | tee out/resultado.txt
      - name: Publicar resultados
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release delete prueba -y --cleanup-tag 2>/dev/null || true
          gh release create prueba out/* --title prueba --notes "resultados de prueba"
