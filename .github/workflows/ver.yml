name: ver
on:
  push:
    paths: ['jobs/ver.txt']
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q -U "yt-dlp[default]"
      - name: Hojas
        run: |
          ID=$(tr -d '[:space:]' < jobs/ver.txt); echo "ID=$ID" >> $GITHUB_ENV
          python motor/ver.py "$ID" 2>&1 | tee log_ver.txt
      - name: Publicar
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p out; cp log_ver.txt out/ 2>/dev/null || true
          gh release delete "ver-$ID" -y --cleanup-tag 2>/dev/null || true
          gh release create "ver-$ID" out/* --title "ver-$ID" --notes "hojas"
